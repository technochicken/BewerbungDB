<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – BewerbungsDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background-color: #0f172a; color: #e2e8f0; }
    input { background-color: #1e293b !important; color: #e2e8f0 !important; border-color: #475569 !important; }
    input::placeholder { color: #475569 !important; }
    input:focus { outline: none; border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,.25) !important; }
  </style>
</head>
<body class="h-full flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div style="background:#1e293b; border:1px solid #334155;" class="rounded-xl shadow-md p-8">

      <div class="text-center mb-7">
        <h1 class="text-2xl font-bold text-slate-100">BewerbungsDB</h1>
        <p class="text-sm text-slate-400 mt-1">Bitte anmelden</p>
      </div>

      {% if error %}
      <div style="background:#450a0a; border:1px solid #7f1d1d; color:#f87171;" class="text-sm px-4 py-2.5 rounded-lg mb-5">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Passwort</label>
          <input type="password" name="password" autofocus required
                 class="w-full border rounded-lg px-3 py-2.5 text-sm">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors">
          Anmelden
        </button>
      </form>

      {% if oidc_providers %}
      <div class="mt-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="flex-1 border-t border-slate-600"></div>
          <span class="text-xs text-slate-500 shrink-0">oder anmelden mit</span>
          <div class="flex-1 border-t border-slate-600"></div>
        </div>
        <div class="space-y-2">
          {% for provider in oidc_providers %}
          <a href="/auth/oidc/{{ provider.name }}/login?next={{ next }}"
             class="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg text-sm font-medium transition-colors"
             style="background:#1e3a5f; color:#93c5fd; border:1px solid #1e40af;">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            {{ provider.name }}
          </a>
          {% endfor %}
        </div>
      </div>
      {% endif %}

    </div>
    <p class="text-center text-xs text-slate-500 mt-4">BewerbungsDB – privates Bewerbungsmanagement</p>
  </div>

</body>
</html>
